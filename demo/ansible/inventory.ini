# Ansible connects to target container via SSH (compose networking)
# In production, add one line per real server here.
[targets]
target ansible_host=target ansible_user=root ansible_password=demo1234

[targets:vars]
# Which CIS profile to scan against (L1 or full CIS)
cis_profile=xccdf_org.ssgproject.content_profile_cis
# SCAP content path (Rocky Linux 9)
scap_content=/usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml
